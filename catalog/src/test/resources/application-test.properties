catalog.service.url=http://localhost:8082
spring.kafka.bootstrap-servers=localhost:9002

spring.kafka.consumer.key-deserializer=org.apache.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.catalog.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.catalog.event,com.example.catalog.model