name: Catalog Service CI

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
  pull_request:
    branches: [main]
    paths:
      - 'catalog/**'

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
      ports:
        - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test Catalog
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/catalog_db
        run: |
          cd catalog
          mvn clean test