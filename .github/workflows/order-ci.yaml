name: Order Service CI

on:
  push:
    branches: [main]
    paths:
      - 'order/**'
  pull_request:
    branches: [main]
    paths:
      - 'order/**'

jobs:
  build-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Test Catalog
        run: |
          cd order
          mvn clean test