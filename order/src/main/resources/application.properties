spring.application.name=order
#catalog.service.url=http://localhost:8081
spring.cloud.discovery.enabled=false
spring.coud.discovery.simple.enabled=false
debug=true
server.port=8081
logging.level.org.springframework=DEBUG
#spring.datasource.url=jdbc:h2:mem:order_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=sa
#spring.datasource.password=
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retail_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:retail_password}
#spring.jpa.database.platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceConfiguration,org.springframework.boot.autoconfigure.jpa.HibernateJpaAutoConfiguration
spring.main.allow-bean-definition-overriding=true
catalog.service.url=http://localhost:8081
#Disable Spring Cloud Service Discovery for tests
spring.cloud.discovery.enabled=false
spring.cloud.simple.discovery.enabled=false
#spring.autoconfigure.exclude=org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration
logging.level.org.springframework.beans.factory=DEBUG
logging.level.org.springframework.cloud.openfeign=TRACE
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

#Consumer Setup
spring.kafka.consumer.group-id=inventory-processing-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
